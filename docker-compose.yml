services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U inventory -d inventory" ]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventory
      DB_USERNAME: inventory
      DB_PASSWORD: inventory
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
